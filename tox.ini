[tox]
minversion = 1.6
skipsdist = True
envlist = flake8, black

[testenv:flake8]
basepython = python3
commands = flake8 {posargs}
deps =
    flake8
    flake8-blind-except
    flake8-bugbear
    flake8-builtins
    flake8-docstrings
    flake8-import-order
    flake8-rst-docstrings

[testenv:black]
basepython = python3
commands = black --check --diff k8s_status
deps = black

[flake8]
exclude = .tox,__pycache__,venv,app.py
count = 1
show-pep8 = 1
show-source = 1
statistics = 1
enable-extensions = G
import-order-style = appnexus
application-package-names = k8s
convention = pep257
select = A,B,B9,C,D,E,F,G,I,RST,W
ignore = B902

[nosetests]
verbosity=3
with-doctest=1
