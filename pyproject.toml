[tool.black]
line-length = 79
target_version = ['py311']
include = '\.pyi?$'
exclude = '/(\.git|\.tox)/'

[project]
name = "k8s-status"
version = "0.1.0"
description = ""
authors = [
    {name = "David Caro",email = "dcaro@wikimedia.org"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachelib (>=0.17.0,<0.18.0)",
    "flask (>=3.1.3,<4.0.0)",
    "ldap3 (>=2.9.1,<3.0.0)",
    "kubernetes (==21.7.0)",
    "natsort (>=8.4.0,<9.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
