<!DOCTYPE html>
<html>
<head>
<link type="text/css" rel="stylesheet" href="https://tools-static.wmflabs.org/cdnjs/ajax/libs/swagger-ui/5.17.14/swagger-ui.css">
<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}">
<title>k8s-status API</title>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://tools-static.wmflabs.org/cdnjs/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script>
const ui = SwaggerUIBundle({
  url: "{{ url_for('api.openapi') }}",
  dom_id: "#swagger-ui",
  layout: "BaseLayout",
  deepLinking: true,
  presets: [
    SwaggerUIBundle.presets.apis,
    SwaggerUIBundle.SwaggerUIStandalonePreset
  ],
})
</script>
</body>
</html>
